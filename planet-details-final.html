<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03050d">
<title>Planet Details — EXPLOR THE SPACE</title>
<meta name="description" content="Detailed information about the planets of our solar system.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Arial,sans-serif;color:#f5f7ff;background:#03050d;line-height:1.7;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 80% 15%,rgba(117,80,255,.16),transparent 28%),radial-gradient(circle at 15% 75%,rgba(0,160,255,.08),transparent 30%),#03050d}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:85px 85px;pointer-events:none}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,92%);margin:auto}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:"Space Grotesk";font-weight:700}.logo span{color:#9b7cff}
.back{color:#bfc5d6;font-size:.9rem}.back:hover{color:#fff}
.hero{padding:105px 0 55px;display:grid;grid-template-columns:1fr .9fr;align-items:center;gap:55px}
.eyebrow{color:#9e84ff;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800}
h1,h2,h3{font-family:"Space Grotesk"}
h1{font-size:clamp(3.2rem,8vw,6.5rem);line-height:.9;margin:13px 0}
.subtitle{font-size:1.08rem;color:#b9c0d1;max-width:600px}
.planet-visual{height:430px;display:grid;place-items:center;position:relative}
.planet-visual:before{content:"";position:absolute;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(130,93,255,.22),transparent 68%);filter:blur(25px)}
.planet-visual img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 25px 45px rgba(0,0,0,.65))}
.badge{display:inline-block;margin-top:25px;padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);color:#cbd1e1;font-size:.78rem}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 65px}
.stat{padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(8,11,25,.72)}
.stat small{display:block;color:#8d95a8;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.stat strong{font-size:.88rem}
.section{padding:30px 0 70px}
.section h2{font-size:2.4rem;margin-bottom:12px}
.section p{color:#b6bdcd;max-width:850px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:24px}
.fact{padding:22px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035)}
.fact h3{font-size:1.1rem;margin-bottom:7px}.fact p{font-size:.92rem}
.nav-planets{display:flex;justify-content:space-between;gap:15px;margin:20px 0 70px}
.nav-planets a{padding:13px 17px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.035);color:#bfc6d7}
.nav-planets a:hover{border-color:#8d70ff;color:#fff}
footer{padding:35px 0;border-top:1px solid rgba(255,255,255,.08);color:#7f8798}
@media(max-width:850px){.hero{grid-template-columns:1fr;text-align:center}.subtitle{margin:auto}.planet-visual{height:350px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.nav{height:65px}.back{font-size:.78rem}.hero{padding-top:70px}.planet-visual{height:290px}.stats{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.section h2{font-size:2rem}}
</style>
</head>

<body>
<div class="container">
<nav class="nav">
<a class="logo" href="index.html">EXPLOR <span>THE SPACE</span></a>
<a class="back" href="index.html#planets">← All Planets</a>
</nav>

<main id="app"></main>

<footer>EXPLOR THE SPACE · Explore more. Stay curious.</footer>
</div>

<script>
const planets = {
  mercury:{
    name:"Mercury", type:"Rocky Planet", order:"01 · Closest to the Sun",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/mercury-messenger-globe.jpg",
    moons:"0", temp:"167°C mean", mass:"3.30 × 10²³ kg", size:"4,879 km diameter", distance:"≈ 77 million km",
    about:"Mercury is the smallest planet in our solar system and the planet closest to the Sun. Its thin exosphere cannot hold heat well, so its surface experiences enormous temperature swings.",
    atmosphere:"Mercury has an extremely thin exosphere rather than a thick atmosphere. It contains atoms such as oxygen, sodium, hydrogen, helium and potassium.",
    facts:["A Mercury year lasts only 88 Earth days.","Its surface is heavily covered with impact craters.","Daytime temperatures can reach about 430°C, while nighttime temperatures can fall to about −180°C.","Mercury has a global magnetic field, although it is much weaker than Earth's."]
  },
  venus:{
    name:"Venus", type:"Rocky Planet", order:"02 · Hottest planet",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/venus-globe.jpg",
    moons:"0", temp:"464°C mean", mass:"4.87 × 10²⁴ kg", size:"12,104 km diameter", distance:"≈ 41 million km",
    about:"Venus is similar to Earth in size but has an extremely different environment. Its thick atmosphere produces a powerful greenhouse effect, making Venus the hottest planet in the solar system.",
    atmosphere:"The atmosphere is dominated by carbon dioxide, with nitrogen and clouds of sulfuric acid. Surface pressure is roughly 93 times Earth's sea-level pressure.",
    facts:["Venus rotates in the opposite direction to most planets.","A Venusian day is longer than its year.","It is the hottest planet in the solar system.","Venus has no natural moons."]
  },
  earth:{
    name:"Earth", type:"Rocky Planet", order:"03 · Our home",
    image:"https://science.nasa.gov/wp-content/uploads/2023/09/earth-1-jpg.webp",
    moons:"1", temp:"15°C mean", mass:"5.97 × 10²⁴ kg", size:"12,742 km diameter", distance:"0 km",
    about:"Earth is the third planet from the Sun and the only world currently known to support life. Liquid water covers most of its surface and its atmosphere helps regulate temperature.",
    atmosphere:"Earth's atmosphere is mostly nitrogen and oxygen, with smaller amounts of argon, carbon dioxide and water vapor.",
    facts:["Earth is about 4.5 billion years old.","About 71% of its surface is covered by water.","Earth has one natural satellite: the Moon.","It has a strong global magnetic field that helps shield the planet from charged particles."]
  },
  mars:{
    name:"Mars", type:"Rocky Planet", order:"04 · The Red Planet",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/mars-full-globe.jpg",
    moons:"2", temp:"−65°C mean", mass:"6.42 × 10²³ kg", size:"6,779 km diameter", distance:"≈ 225 million km",
    about:"Mars is a cold, dusty world with a thin atmosphere and a surface rich in iron minerals that give the planet its reddish appearance.",
    atmosphere:"Mars has a very thin atmosphere dominated by carbon dioxide, with smaller amounts of nitrogen and argon.",
    facts:["Mars has two small moons: Phobos and Deimos.","Olympus Mons is the largest known volcano in the solar system.","Mars has polar ice caps.","Ancient Mars had rivers, lakes and other evidence of a wetter past."]
  },
  jupiter:{
    name:"Jupiter", type:"Gas Giant", order:"05 · Largest planet",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/jupiter-globe.jpg",
    moons:"95+", temp:"−110°C*", mass:"1.90 × 10²⁷ kg", size:"139,820 km diameter", distance:"≈ 778 million km",
    about:"Jupiter is the largest planet in our solar system. It is a gas giant with no solid surface that we could stand on, and it is famous for its colorful cloud bands and enormous storms.",
    atmosphere:"Jupiter's atmosphere is mostly hydrogen and helium, with smaller amounts of methane, ammonia, water vapor and other compounds.",
    facts:["Jupiter is about 11 times wider than Earth.","The Great Red Spot is a giant long-lived storm.","Jupiter has a very strong magnetic field.","Its four famous Galilean moons are Io, Europa, Ganymede and Callisto."]
  },
  saturn:{
    name:"Saturn", type:"Gas Giant", order:"06 · Ringed world",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/saturn-globe.jpg",
    moons:"274", temp:"−140°C*", mass:"5.68 × 10²⁶ kg", size:"116,460 km diameter", distance:"≈ 1.43 billion km",
    about:"Saturn is the second-largest planet and is best known for its spectacular ring system. Like Jupiter, it is a gas giant without a solid surface.",
    atmosphere:"Saturn's atmosphere is primarily hydrogen and helium, with smaller amounts of methane, ammonia and other compounds.",
    facts:["Saturn's rings are made mostly of ice particles and rocky debris.","Saturn is less dense than water.","Titan, Saturn's largest moon, has a thick atmosphere.","Saturn has a powerful magnetic environment."]
  },
  uranus:{
    name:"Uranus", type:"Ice Giant", order:"07 · Sideways world",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/uranus-globe.jpg",
    moons:"28", temp:"−195°C*", mass:"8.68 × 10²⁵ kg", size:"50,724 km diameter", distance:"≈ 2.87 billion km",
    about:"Uranus is an ice giant with a blue-green appearance caused mainly by methane in its atmosphere. Its rotation is strongly tilted, making the planet appear to roll around the Sun.",
    atmosphere:"Uranus is mostly hydrogen and helium, with methane in the upper atmosphere. Deeper inside are hot, dense fluids rich in water, ammonia and methane.",
    facts:["Uranus rotates at an extreme axial tilt of about 98°.","It has faint rings.","Its blue-green color comes largely from atmospheric methane.","Uranus has a complex magnetic field."]
  },
  neptune:{
    name:"Neptune", type:"Ice Giant", order:"08 · Farthest planet",
    image:"https://science.nasa.gov/wp-content/uploads/2024/03/neptune-globe.jpg",
    moons:"16", temp:"−200°C*", mass:"1.02 × 10²⁶ kg", size:"49,244 km diameter", distance:"≈ 4.50 billion km",
    about:"Neptune is the eighth and farthest planet from the Sun. It is an ice giant with extremely fast winds and a dynamic atmosphere.",
    atmosphere:"Neptune's atmosphere is mainly hydrogen and helium, with methane contributing to its blue color.",
    facts:["Neptune has the fastest winds measured on a planet in our solar system.","Its largest moon is Triton.","Neptune has faint rings.","One Neptune year lasts about 165 Earth years."]
  }
};

const order=["mercury","venus","earth","mars","jupiter","saturn","uranus","neptune"];
const key=new URLSearchParams(location.search).get("planet") || "earth";
const p=planets[key] || planets.earth;
const i=order.indexOf(key);

document.title=`${p.name} — EXPLOR THE SPACE`;

document.getElementById("app").innerHTML=`
<section class="hero">
  <div>
    <div class="eyebrow">${p.order}</div>
    <h1>${p.name}</h1>
    <p class="subtitle">${p.about}</p>
    <span class="badge">${p.type}</span>
  </div>
  <div class="planet-visual">
    <img src="${p.image}" alt="${p.name}">
  </div>
</section>

<section>
  <div class="stats">
    <div class="stat"><small>Moons</small><strong>${p.moons}</strong></div>
    <div class="stat"><small>Mean temperature</small><strong>${p.temp}</strong></div>
    <div class="stat"><small>Mass</small><strong>${p.mass}</strong></div>
    <div class="stat"><small>Diameter</small><strong>${p.size}</strong></div>
    <div class="stat"><small>Distance from Earth</small><strong>${p.distance}</strong></div>
  </div>
</section>

<section class="section">
  <div class="eyebrow">Atmosphere</div>
  <h2>What's around ${p.name}?</h2>
  <p>${p.atmosphere}</p>
</section>

<section class="section">
  <div class="eyebrow">Quick facts</div>
  <h2>Things to know</h2>
  <div class="facts">
    ${p.facts.map((fact,n)=>`<article class="fact"><h3>0${n+1}</h3><p>${fact}</p></article>`).join("")}
  </div>
</section>

<div class="nav-planets">
  ${i>0?`<a href="?planet=${order[i-1]}">← ${planets[order[i-1]].name}</a>`:"<span></span>"}
  <a href="index.html#planets">All Planets</a>
  ${i<order.length-1?`<a href="?planet=${order[i+1]}">${planets[order[i+1]].name} →</a>`:"<span></span>"}
</div>
`;
</script>
</body>
</html>
